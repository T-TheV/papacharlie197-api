[program:cadencia-postgresql]
command=/usr/lib/postgresql/16/bin/postgres -D /var/lib/postgresql/16/main -c config_file=/var/lib/postgresql/16/main/postgresql.conf
environment=LD_PRELOAD="/opt/cadencia/libproot-pg-owner.so"
priority=10
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stdout_logfile=/opt/cadencia/shared/postgresql.log
stderr_logfile=/opt/cadencia/shared/postgresql-error.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3

[program:cadencia-backend]
command=/opt/cadencia/bin/start-backend.sh
priority=30
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stdout_logfile=/opt/cadencia/shared/backend.log
stderr_logfile=/opt/cadencia/shared/backend-error.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3

[program:cadencia-caddy]
command=/usr/bin/caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
priority=40
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
stdout_logfile=/opt/cadencia/shared/caddy.log
stderr_logfile=/opt/cadencia/shared/caddy-error.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3

[program:cadencia-cloudflared]
command=/opt/cadencia/bin/start-cloudflared.sh
priority=45
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stdout_logfile=/opt/cadencia/shared/cloudflared.log
stderr_logfile=/opt/cadencia/shared/cloudflared-error.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3

[program:cadencia-deploy]
command=/opt/cadencia/bin/deploy-loop.sh
priority=50
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
stdout_logfile=/opt/cadencia/shared/deploy.log
stderr_logfile=/opt/cadencia/shared/deploy-error.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3
